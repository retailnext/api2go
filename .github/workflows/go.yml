name: Run Tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: "go.mod"

      - name: Install dependencies
        run: |
          go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: -v
          skip-cache: false

  test:
    runs-on: ubuntu-latest
    name: Go tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: "go.mod"

      - name: Install dependencies
        run: |
          go get -t -d -v ./...
          go install github.com/bwplotka/bingo@v0.9.0
          bingo get -l

      - name: Run tests
        run: |
          ginkgo -r -cover --randomizeAllSpecs --randomizeSuites --failOnPending --trace --race --progress
          ginkgo -tags=gorillamux -r --randomizeSuites --failOnPending --trace --race
          ginkgo -tags=gingonic -r --randomizeSuites --failOnPending --trace --race
          ginkgo -tags=echo -r --randomizeSuites --failOnPending --trace --race
          rm examples/examples.coverprofile
          gover

      - name: Upload coverage to Coveralls
        env:
          COVERALLS_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        if: env.COVERALLS_TOKEN != ''
        run: goveralls -coverprofile=gover.coverprofile 